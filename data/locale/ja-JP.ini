NVoice.Compressor.Description="普段の声（−9 dBFS）の大きさは変えずに、大きな声を抑えて小さな声との差を縮めます。どんなに大きな声でも、最後の音割れ防止で −1 dBFS を超えないようにしています。"
NVoice.Compressor.Meter="いま抑えている量"
NVoice.AutoLeveler.Description="話し声が、OBSのメーターで赤の始まり（−9 dBFS）に届くように音量を自動で合わせます。この目安はどの配信スタイルでも同じです。話していない間は音量を変えないので、無音時の環境音は持ち上げません。"
NVoice.AutoLeveler.Meter="いまの補正量"

NVoice.Param.Strength="抑える強さ"
NVoice.Param.Strength.Help="大きな声と小さな声の差をどれくらい縮めるか。動かすと「どのくらい大きな声から抑える？」と「大きな声をどれくらい抑える？」がまとめて変わります。"
NVoice.Param.Threshold="どのくらい大きな声から抑える？"
NVoice.Param.Threshold.Help="Threshold：この音量を超えた部分から抑え始めます。"
NVoice.Param.Ratio="大きな声をどれくらい抑える？"
NVoice.Param.Ratio.Help="Ratio：超えた分を何分の1にするか。大きいほど強く抑えます。"
NVoice.Param.Attack="大きな声への反応速度"
NVoice.Param.Attack.Help="Attack：大きな声が来てから抑え始めるまでの時間。短いほど素早く抑えます。"
NVoice.Param.Release="元の音量に戻る速度"
NVoice.Param.Release.Help="Release：大きな声が終わってから元に戻るまでの時間。"
NVoice.Param.Makeup="圧縮後の声をどれくらい持ち上げる？"
NVoice.Param.Makeup.Help="Makeup Gain：抑えて小さくなった分を全体で持ち上げます。"
NVoice.Param.Target="目標の音量"
NVoice.Param.Target.Help="話し声をこの音量（RMS）に近づけます。"
NVoice.Param.MaxGain="小さな声をどこまで持ち上げる？"
NVoice.Param.MaxGain.Help="小声のときに上げる量の上限。大きくすると小声に強いですが、環境音も一緒に大きくなります。"
NVoice.Param.Speed="音量を合わせるまでの時間"
NVoice.Param.Speed.Help="音量の変化にどれくらいの時間で追いつくか。短いほど素早く、長いほど自然になります。"
NVoice.Param.MaxCut="大きな声をどこまで下げる？"
NVoice.Param.MaxCut.Help="大きな声のときに下げる量の上限。"
NVoice.Param.Gate="これより小さい音は無音とみなす"
NVoice.Param.Gate.Help="この音量より小さい間は補正量を変えません。環境音が大きい部屋では上げてください。"

NVoice.Wave.Input="入力"
NVoice.Wave.Output="処理後"
NVoice.Wave.Threshold="抑え始める音量"
NVoice.Wave.Threshold.Help="点線は、コンプレッサーが抑え始める音量です。入力の波形がこの線を超えた部分が抑えられます。オートレベラーの補正に合わせて線の位置も動きます。"

NVoice.Calib.Button="声に合わせて自動設定"
NVoice.Calib.Button.Tooltip="例文を10秒ほど読むと、あなたの声と部屋に合わせた設定を提案します"
NVoice.Calib.Title="声に合わせて自動設定"
NVoice.Calib.Intro="「測定を始める」を押したら、下の文を上から順に読んでください。読む行が順番に光ります。行の間は少し間を空けてください（%2秒で終わります）。「%1」の設定を出発点にして、あなたの声に合わせて調整します。"
NVoice.Calib.Start="測定を始める"
NVoice.Calib.Cancel="キャンセル"
NVoice.Calib.Retry="やり直す"
NVoice.Calib.Apply="この設定を適用"
NVoice.Calib.Recording="測定中"
NVoice.Calib.Remaining="残り %1 秒"
NVoice.Calib.Seconds="%1 秒"
NVoice.Calib.Measured="測った結果"
NVoice.Calib.M.Speech="話し声（OBSメーターの読み）"
NVoice.Calib.M.Noise="話していない間の音（環境音）"
NVoice.Calib.M.Range="声の大小の幅"
NVoice.Calib.M.Time="話していた時間"
NVoice.Calib.Proposal="提案する設定（今 → 提案）"
NVoice.Calib.Others="反応速度など、ここにない設定は「%1」の値になります。"
NVoice.Calib.NoChange="%1（変更なし）"
NVoice.Calib.Note="提案は測った声をもとにした出発点です。適用した後も、各機能の画面で調整できます。適用しても「元に戻す」で戻せます。"
NVoice.Calib.Applied="声に合わせた設定を適用しました。合わないと感じたら「元に戻す」か、各機能の画面で調整してください。"
NVoice.Calib.Issue.NotEnoughSpeech="話し声を十分に測れませんでした。マイクに近づいて、もう一度読んでみてください。マイクが選ばれているかも確認してください。"
NVoice.Calib.Issue.TooQuiet="マイクの音量がかなり小さめです。自動調整だけでは持ち上げきれないことがあるので、Windowsのサウンド設定やマイク本体で入力音量を上げてから、やり直すのがおすすめです。"
NVoice.Calib.Issue.Clipping="大きな声のときに音が割れそうな音量になっています。マイク本体やWindowsのサウンド設定で入力音量を少し下げてください。"
NVoice.Calib.Issue.Noisy="話していない間の音（環境音）が大きめです。無音とみなす音量を上げて、環境音を持ち上げないようにしました。ノイズ除去があるとさらに改善します（AIノイズ除去は準備中です）。"

NVoice.Calib.Chat.Guide1="いつもの声で"
NVoice.Calib.Chat.Line1="「こんばんは！今日も配信に来てくれてありがとう。」"
NVoice.Calib.Chat.Guide2="少し小さめに、つぶやくように"
NVoice.Calib.Chat.Line2="「えーっと、今日は何から話そうかな…」"
NVoice.Calib.Chat.Guide3="少し大きめに、盛り上がって"
NVoice.Calib.Chat.Line3="「え、それめっちゃいいね！ナイス！」"
NVoice.Calib.Game.Guide1="いつもの声で"
NVoice.Calib.Game.Line1="「よし、じゃあ今日もやっていきます。」"
NVoice.Calib.Game.Guide2="少し小さめに、考えながら"
NVoice.Calib.Game.Line2="「あれ、ここどっちだっけ…」"
NVoice.Calib.Game.Guide3="大きめに、試合中のテンションで"
NVoice.Calib.Game.Line3="「うわっ、危ない！よっしゃ勝った！」"
NVoice.Calib.Singing.Guide1="いつもの声で"
NVoice.Calib.Singing.Line1="「今日も歌っていきます、よろしくお願いします。」"
NVoice.Calib.Singing.Guide2="少し小さめに、曲紹介のように"
NVoice.Calib.Singing.Line2="「次は、しっとりめの曲です。」"
NVoice.Calib.Singing.Guide3="歌う声で"
NVoice.Calib.Singing.Line3="いつも歌っている曲のサビを、ワンフレーズ歌ってください"
NVoice.Calib.LateNight.Guide1="夜のいつもの声で"
NVoice.Calib.LateNight.Line1="「こんばんは、夜遅くまでありがとう。」"
NVoice.Calib.LateNight.Guide2="ささやくくらい小さめに"
NVoice.Calib.LateNight.Line2="「今日はゆっくり話していこうね。」"
NVoice.Calib.LateNight.Guide3="少しだけ大きめに、笑いながら"
NVoice.Calib.LateNight.Line3="「ふふっ、それはちょっと面白いね。」"
NVoice.Meter.Hint="OBSのミキサーと同じ表示です。話しているときに「処理後」が赤の始まり（−9 dBFS）に届いていれば目安どおりです。大きな声でも −1 dBFS を超えないように抑えます。"
