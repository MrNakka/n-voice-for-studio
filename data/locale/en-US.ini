NVoice.Param.Makeup.Help="Makeup gain: raises the overall level after reduction."
NVoice.Param.Target="Target level"
NVoice.Param.Target.Help="Speaking level (RMS) to aim for."
NVoice.Param.MaxGain="Max lift for quiet speech"
NVoice.Param.MaxGain.Help="Upper limit of boost. Higher helps quiet speech but also raises room noise."
NVoice.Param.Speed="Time to match the level"
NVoice.Param.Speed.Help="How quickly the level follows changes. Shorter reacts faster, longer sounds more natural."
NVoice.Param.MaxCut="Max cut for loud speech"
NVoice.Param.MaxCut.Help="Upper limit of reduction for loud speech."
NVoice.Param.Gate="Treat quieter sound as silence"
