NVoice.Param.Threshold.Help="Threshold: level above which reduction starts."
NVoice.Param.Ratio="How strongly to reduce"
NVoice.Param.Ratio.Help="Ratio: how much of the excess is kept. Higher reduces more."
NVoice.Param.Attack="Reaction to loud speech"
NVoice.Param.Attack.Help="Attack: time to start reducing after a loud sound."
NVoice.Param.Release="Return to normal"
NVoice.Param.Release.Help="Release: time to recover after the loud sound ends."
