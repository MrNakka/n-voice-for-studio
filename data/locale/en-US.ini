NVoice.Calib.LateNight.Line1="'Good evening, thanks for staying up late.'"
NVoice.Calib.LateNight.Guide2="Quiet, almost a whisper"
NVoice.Calib.LateNight.Line2="'Let's take it slow tonight.'"
