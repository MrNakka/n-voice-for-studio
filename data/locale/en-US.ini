NVoice.Calib.Chat.Guide1="Your normal voice"
NVoice.Calib.Chat.Line1="'Hey everyone, thanks for coming to the stream today.'"
NVoice.Calib.Chat.Guide2="A bit quieter, like muttering"
NVoice.Calib.Chat.Line2="'Hmm, what should we talk about first...'"
NVoice.Calib.Chat.Guide3="A bit louder, excited"
NVoice.Calib.Chat.Line3="'Oh, that's awesome! Nice!'"
NVoice.Calib.Game.Guide1="Your normal voice"
NVoice.Calib.Game.Line1="'Alright, let's get going today.'"
NVoice.Calib.Game.Guide2="A bit quieter, thinking"
NVoice.Calib.Game.Line2="'Wait, which way was it again...'"
NVoice.Calib.Game.Guide3="Louder, mid-match energy"
NVoice.Calib.Game.Line3="'Whoa, close one! Yes, we won!'"
NVoice.Calib.Singing.Guide1="Your normal voice"
NVoice.Calib.Singing.Line1="'Let's sing some songs today, thanks for joining.'"
NVoice.Calib.Singing.Guide2="A bit quieter, introducing a song"
NVoice.Calib.Singing.Line2="'Next up is a slow one.'"
NVoice.Calib.Singing.Guide3="Your singing voice"
NVoice.Calib.Singing.Line3="Sing one phrase from the chorus of a song you often sing"
